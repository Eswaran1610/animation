<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
  </defs>
  <!-- Flame Exhaust -->
  <path d="M170 300 C150 360 200 395 200 395 C200 395 250 360 230 300 Z" fill="url(#flameGrad)" />
  <!-- Rocket Fins -->
  <polygon points="120,290 160,250 160,300" fill="#E11D48" />
  <polygon points="280,290 240,250 240,300" fill="#E11D48" />
  <!-- Rocket Fuselage -->
  <path d="M160 280 L160 170 C160 90 200 30 200 30 C200 30 240 90 240 170 L240 280 Z" fill="url(#rocketGrad)" />
  <!-- Porthole Window -->
  <circle cx="200" cy="150" r="26" fill="#0F172A" stroke="#FFFFFF" stroke-width="6" />
  <circle cx="200" cy="150" r="18" fill="#38BDF8" />
  <!-- Cute Cartoon Eyes in Window -->
  <circle cx="195" cy="150" r="4" fill="#FFFFFF" />
  <circle cx="205" cy="150" r="4" fill="#FFFFFF" />
  <!-- Speed lines -->
  <line x1="80" y1="180" x2="120" y2="180" stroke="#FDE047" stroke-width="6" stroke-linecap="round" />
  <line x1="280" y1="210" x2="330" y2="210" stroke="#FDE047" stroke-width="6" stroke-linecap="round" />
</svg>
