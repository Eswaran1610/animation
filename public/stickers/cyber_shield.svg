<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Shield Body -->
  <path d="M200 40 C300 40 340 70 340 160 C340 280 200 360 200 360 C200 360 60 280 60 160 C60 70 100 40 200 40 Z" fill="#0F172A" stroke="url(#cyberBg)" stroke-width="12" filter="url(#glow)"/>
  <!-- Lock Shackle -->
  <path d="M160 180 L160 130 C160 100 240 100 240 130 L240 180" fill="none" stroke="#10B981" stroke-width="14" stroke-linecap="round"/>
  <!-- Lock Body -->
  <rect x="140" y="170" width="120" height="90" rx="18" fill="url(#cyberBg)" />
  <!-- Keyhole -->
  <circle cx="200" cy="210" r="10" fill="#0F172A" />
  <polygon points="196,210 204,210 208,230 192,230" fill="#0F172A" />
  <!-- Circuit Nodes -->
  <circle cx="90" cy="160" r="6" fill="#06B6D4" />
  <line x1="90" y1="160" x2="130" y2="160" stroke="#06B6D4" stroke-width="4" stroke-dasharray="4,4" />
  <circle cx="310" cy="160" r="6" fill="#06B6D4" />
  <line x1="310" y1="160" x2="270" y2="160" stroke="#06B6D4" stroke-width="4" stroke-dasharray="4,4" />
</svg>
